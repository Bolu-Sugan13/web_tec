

Quiz · HTML
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet & Web Technologies Quiz</title>
<style>
  *{ box-sizing: border-box; margin:0; padding:0; }
 
  body{
    background: #ffffff;
    color: #1a1a1a;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
 
  .quiz{
    width: 100%;
    max-width: 480px;
  }
 
  .count{
    font-size: 14px;
    color: #777;
    margin-bottom: 8px;
  }
 
  h1#question{
    font-size: 20px;
    line-height: 1.4;
    margin-bottom: 20px;
  }
 
  .options{
    display: grid;
    gap: 10px;
    margin-bottom: 16px;
  }
 
  .opt{
    text-align: left;
    background: #fff;
    border: 1px solid #ccc;
    color: #1a1a1a;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  .opt:hover:not(:disabled){ border-color: #888; }
  .opt:disabled{ cursor: default; }
 
  .opt.correct{ border-color: #2e7d32; background: #eaf7ea; }
  .opt.wrong{ border-color: #c62828; background: #fbeaea; }
 
  .feedback{
    font-size: 14px;
    color: #444;
    line-height: 1.5;
    margin-bottom: 20px;
    min-height: 20px;
  }
 
  .footer-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
  }
 
  .score{
    font-size: 14px;
    color: #555;
  }
 
  button.next{
    background: #1a1a1a;
    color: #fff;
    border: none;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
  }
  button.next.show{ opacity: 1; pointer-events: all; }
 
  /* results screen */
  .results{ display:none; text-align:center; }
  .results.show{ display:block; }
  .results .big{
    font-size: 44px;
    margin: 8px 0;
  }
  .results .verdict{
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .results p.sub{ color: #777; font-size: 14px; margin-bottom: 24px; }
  .results button.next{ opacity:1; pointer-events:all; }
</style>
</head>
<body>
 
<div class="quiz">
  <div id="quiz-screen">
    <div class="count" id="q-count">Question 1 / 20</div>
    <h1 id="question">Loading question…</h1>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="footer-row">
      <div class="score">Score: <span id="score">0</span> / 20</div>
      <button class="next" id="next-btn">Next</button>
    </div>
  </div>
 
  <div class="results" id="results">
    <div class="big" id="final-score">0/20</div>
    <div class="verdict" id="verdict"></div>
    <p class="sub" id="verdict-sub"></p>
    <button class="next show" id="restart-btn">Restart</button>
  </div>
</div>
 
<script>
const questions = [
  { q: "What does HTTP stand for?", opts: ["HyperText Transfer Protocol","High Transfer Text Protocol","HyperText Transmission Process","Host Transfer Text Program"], a: 0, fact: "HTTP has moved through versions 0.9 → 1.1 → 2 → 3, each improving speed and connection handling." },
  { q: "Which port does HTTPS use by default?", opts: ["80","21","443","8080"], a: 2, fact: "Port 443 is reserved for HTTPS, while plain HTTP uses port 80." },
  { q: "What does DNS primarily do?", opts: ["Encrypts web traffic","Translates domain names into IP addresses","Compresses images","Manages cookies"], a: 1, fact: "DNS is often called the 'phonebook of the internet'." },
  { q: "Which tag is used to link an external CSS file in HTML?", opts: ["<style>", "<css>", "<link>", "<script>"], a: 2, fact: "The <link> tag with rel='stylesheet' connects external CSS to an HTML document." },
  { q: "What does CSS stand for?", opts: ["Cascading Style Sheets","Computer Style Sheets","Creative Style System","Colorful Style Syntax"], a: 0, fact: "'Cascading' refers to how style rules override each other based on specificity and order." },
  { q: "Which HTTP method is typically used to submit form data that changes server state?", opts: ["GET","POST","LINK","SHOW"], a: 1, fact: "POST sends data in the request body, while GET appends data to the URL." },
  { q: "What is the correct file extension for JavaScript files?", opts: [".java",".js",".jsx only",".javascript"], a: 1, fact: "JavaScript files use the .js extension, unrelated to Java despite the similar name." },
  { q: "Which protocol is used to transfer files securely over the internet?", opts: ["FTP","SFTP","SMTP","ARP"], a: 1, fact: "SFTP (SSH File Transfer Protocol) encrypts data during file transfer, unlike plain FTP." },
  { q: "What does the acronym URL stand for?", opts: ["Uniform Resource Locator","Universal Reference Link","United Resource Locator","Uniform Referral Location"], a: 0, fact: "A URL specifies both the location of a resource and the protocol used to access it." },
  { q: "Which of these is a client-side scripting language?", opts: ["PHP","JavaScript","MySQL","Python (server-side)"], a: 1, fact: "JavaScript runs directly in the browser, enabling interactivity without server round-trips." },
  { q: "What is the purpose of the <head> section in an HTML document?", opts: ["Displays the main visible content","Holds metadata, title, and links to resources","Creates the page footer","Defines table headers"], a: 1, fact: "The <head> never renders directly on the page — it configures the document instead." },
  { q: "Which status code indicates 'Page Not Found'?", opts: ["200","301","404","500"], a: 2, fact: "404 means the server couldn't find the requested resource — a web classic." },
  { q: "What does IP stand for in networking?", opts: ["Internet Protocol","Internal Process","Interface Program","Instant Ping"], a: 0, fact: "IP addresses uniquely identify devices on a network so data can find its way home." },
  { q: "Which CSS property controls the space between an element's border and its content?", opts: ["margin","padding","spacing","gap"], a: 1, fact: "Padding is inside the border; margin is outside it — a classic mix-up." },
  { q: "What does 'www' stand for?", opts: ["World Wide Web","Web Wide World","World Web Wide","Wide World Web"], a: 0, fact: "The WWW was invented by Tim Berners-Lee in 1989 at CERN." },
  { q: "Which language is primarily used to style web pages?", opts: ["HTML","CSS","XML","JSON"], a: 1, fact: "HTML structures content, CSS styles it, and JavaScript makes it interactive." },
  { q: "What is a cookie in web technology?", opts: ["A cached image file","A small piece of data stored by the browser","A type of server error","A CSS animation"], a: 1, fact: "Cookies let servers remember things like login sessions between page requests." },
  { q: "Which of the following is NOT a valid HTML5 semantic tag?", opts: ["<article>","<section>","<container>","<footer>"], a: 2, fact: "<container> isn't real HTML — <div> or <section> are the usual choices instead." },
  { q: "What does API stand for?", opts: ["Application Programming Interface","Automated Program Instruction","Applied Protocol Interaction","Application Process Integration"], a: 0, fact: "APIs let different software systems talk to each other using defined rules." },
  { q: "Which HTML attribute specifies an alternate text for an image if it fails to load?", opts: ["title","src","alt","desc"], a: 2, fact: "The alt attribute also helps screen readers describe images to visually impaired users." }
];
 
let current = 0;
let score = 0;
let answered = false;
let order = [];
let previousOrder = null;
 
const qCountEl = document.getElementById('q-count');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const scoreEl = document.getElementById('score');
const nextBtn = document.getElementById('next-btn');
const quizScreen = document.getElementById('quiz-screen');
const resultsScreen = document.getElementById('results');
 
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
 
function arraysEqual(a, b){
  return a.length === b.length && a.every((v, i) => v === b[i]);
}
 
function generateOrder(){
  const base = questions.map((_, i) => i);
  let newOrder;
  do {
    newOrder = shuffleArray(base);
  } while (previousOrder && arraysEqual(newOrder, previousOrder));
  previousOrder = newOrder;
  return newOrder;
}
 
function renderQuestion(){
  answered = false;
  const item = questions[order[current]];
  qCountEl.textContent = `Question ${current + 1} / ${questions.length}`;
  questionEl.textContent = item.q;
  feedbackEl.textContent = '';
  nextBtn.classList.remove('show');
 
  optionsEl.innerHTML = '';
  item.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsEl.appendChild(btn);
  });
}
 
function selectAnswer(i, btn){
  if (answered) return;
  answered = true;
  const item = questions[order[current]];
  const correct = i === item.a;
  const allBtns = optionsEl.querySelectorAll('.opt');
  allBtns.forEach(b => b.disabled = true);
 
  allBtns[item.a].classList.add('correct');
  if (!correct) btn.classList.add('wrong');
 
  if (correct) score++;
 
  scoreEl.textContent = score;
  feedbackEl.textContent = (correct ? 'Correct — ' : 'Not quite — ') + item.fact;
  nextBtn.classList.add('show');
  nextBtn.textContent = current === questions.length - 1 ? 'See results' : 'Next';
}
 
function nextQuestion(){
  if (current < questions.length - 1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}
 
function showResults(){
  quizScreen.style.display = 'none';
  resultsScreen.classList.add('show');
  document.getElementById('final-score').textContent = `${score}/${questions.length}`;
 
  let verdict, sub;
  const pct = score / questions.length;
  if (pct === 1){ verdict = "Perfect score!"; sub = "You know this material inside out."; }
  else if (pct >= 0.8){ verdict = "Great job!"; sub = "You clearly know your way around the stack."; }
  else if (pct >= 0.5){ verdict = "Not bad."; sub = "Solid grasp — a bit more revision and you're golden."; }
  else { verdict = "Keep practicing."; sub = "Time to revisit the fundamentals — you've got this."; }
 
  document.getElementById('verdict').textContent = verdict;
  document.getElementById('verdict-sub').textContent = sub;
}
 
function restart(){
  current = 0;
  score = 0;
  scoreEl.textContent = 0;
  quizScreen.style.display = 'block';
  resultsScreen.classList.remove('show');
  order = generateOrder();
  renderQuestion();
}
 
nextBtn.addEventListener('click', nextQuestion);
document.getElementById('restart-btn').addEventListener('click', restart);
 
order = generateOrder();
renderQuestion();
</script>
 
</body>
</html>
