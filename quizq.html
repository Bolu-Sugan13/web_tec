<style>
  *{ box-sizing: border-box; margin:0; padding:0; }
 
  body{
    background: #ffffff;

    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
 
  .quiz{
    width: 100%;

  }
 
  .count{
    font-size: 14px;
    color: #777;
    margin-bottom: 8px;
  }
 
  h1#question{
    font-size: 20px;
    line-height: 1.4;
    margin-bottom: 20px;
  }
 
  .options{
    display: grid;
    gap: 10px;
    margin-bottom: 16px;
  }
 
  .opt{
    text-align: left;
    background: #fff;
    border: 1px solid #ccc;
    color: #1a1a1a;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  .opt:hover:not(:disabled){ border-color: #888; }
  .opt:disabled{ cursor: default; }
 
  .opt.correct{ border-color: #2e7d32; background: #eaf7ea; }
  .opt.wrong{ border-color: #c62828; background: #fbeaea; }
 
  .feedback{
    font-size: 14px;
    color: #444;
    line-height: 1.5;
    margin-bottom: 20px;
    min-height: 20px;
  }
 
  .footer-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
  }
 
  .score{
    font-size: 14px;
    color: #555;
  }
 
  button.next{
    background: #1a1a1a;
    color: #fff;
    border: none;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
  }
  button.next.show{ opacity: 1; pointer-events: all; }
 
  /* results screen */
  .results{ display:none; text-align:center; }
  .results.show{ display:block; }
  .results .big{
    font-size: 44px;
    margin: 8px 0;
  }
  .results .verdict{
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .results p.sub{ color: #777; font-size: 14px; margin-bottom: 24px; }
  .results button.next{ opacity:1; pointer-events:all; }

function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
 
function sameSet(a, b){
  if (!a || !b || a.length !== b.length) return false;
  const sb = new Set(b);
  return a.every(x => sb.has(x));
}
 
function drawRound(){
  const pool = questions.map((_, i) => i);
  let picked;
  do {
    picked = shuffleArray(pool).slice(0, ROUND_SIZE);
  } while (previousOrder && sameSet(picked, previousOrder));
  previousOrder = picked;
  return picked;
}
 
function renderQuestion(){
  answered = false;
  const item = questions[order[current]];
  qCountEl.textContent = `Question ${current + 1} / ${ROUND_SIZE}`;
  questionEl.textContent = item.q;
  feedbackEl.textContent = '';
  nextBtn.classList.remove('show');
 
  optionsEl.innerHTML = '';
  item.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsEl.appendChild(btn);
  });
}
 
function selectAnswer(i, btn){
  if (answered) return;
  answered = true;
  const item = questions[order[current]];
  const correct = i === item.a;
  const allBtns = optionsEl.querySelectorAll('.opt');
  allBtns.forEach(b => b.disabled = true);
 
  allBtns[item.a].classList.add('correct');
  if (!correct) btn.classList.add('wrong');
 
  if (correct) score++;
 
  scoreEl.textContent = score;
  feedbackEl.textContent = (correct ? 'Correct — ' : 'Not quite — ') + item.fact;
  nextBtn.classList.add('show');
  nextBtn.textContent = current === ROUND_SIZE - 1 ? 'See results' : 'Next';
}
 
function nextQuestion(){
  if (current < ROUND_SIZE - 1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}
 
function showResults(){
  quizScreen.style.display = 'none';
  resultsScreen.classList.add('show');
  document.getElementById('final-score').textContent = `${score}/${ROUND_SIZE}`;
 
  let verdict, sub;
  const pct = score / ROUND_SIZE;
  if (pct === 1){ verdict = "Perfect score!"; sub = "You know this material inside out."; }
  else if (pct >= 0.8){ verdict = "Great job!"; sub = "You clearly know your way around the stack."; }
  else if (pct >= 0.5){ verdict = "Not bad."; sub = "Solid grasp — a bit more revision and you're golden."; }
  else { verdict = "Keep practicing."; sub = "Time to revisit the fundamentals — you've got this."; }
 
  document.getElementById('verdict').textContent = verdict;
  document.getElementById('verdict-sub').textContent = sub;
}
 
function restart(){
  current = 0;
  score = 0;
  scoreEl.textContent = 0;
  quizScreen.style.display = 'block';
  resultsScreen.classList.remove('show');
  order = drawRound();
  renderQuestion();
}
 
nextBtn.addEventListener('click', nextQuestion);
document.getElementById('restart-btn').addEventListener('click', restart);
 
order = drawRound();
renderQuestion();
</script>
 
</body>
</html>
